title: DOE IRI Program
description: DOE Integrated Research Infrastructure (IRI) Program
url: https://iri.science
repository: iri-science/iri-science.github.io
registry_repository: https://github.com/doe-iri/iri-facility-api-docs

markdown: kramdown

plugins:
  - jekyll-sitemap    # Adds sitemap to the website at /sitemap.xml
  - jekyll-feed       # Adds feed to the website at /feed.xml
  - jekyll-seo-tag    # Adds all the important SEO meta tags by default.

exclude:
  - .bundle
  - .firecrawl
  - .github
  - .jekyll-cache
  - Gemfile
  - Gemfile.lock
  - scripts
  - test/
  - _registry-source
  - vendor
  - README.md
  - LICENSE

collections:
  ts:
    output: true
    permalink: /ts/:path/
  events:
    output: true
    permalink: /events/:path/
  pathfinders:
    output: true
    permalink: /pathfinders/:path/
  news:
    output: true
    permalink: /news/:path/
