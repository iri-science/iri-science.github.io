<div class="banner text-center">
    <div class="container">
        <div class="row">
            <div class="col-lg-9 mx-auto">
                {% if page.layout == 'registry' %}
                <p class="banner-title">{{ page.title | escape }}</p>
                {% else %}
                <h1 class="banner-title">{{ page.subtitle | default: page.title | escape }}</h1>
                {% endif %}
                {% if page.category %}<p class="banner-label mb-5">{{ page.category | escape }}</p>{% endif %}
            </div>
        </div>
    </div>

</div>
