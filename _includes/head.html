<head>
    <meta charset="utf-8">
    <title>{% if page.title %} {{ page.title }} - {% endif %}{{ site.title }}</title>

    <!-- mobile responsive meta -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <meta name="description" content="{{ page.summary | default: site.description | escape }}">
    {% if page.author %}<meta name="author" content="{{ page.author | escape }}">{% endif %}
    {% if page.registry_identifier %}
    <link rel="canonical" href="{{ page.registry_identifier }}">
    <link rel="alternate" type="text/markdown" href="{{ page.registry_markdown_url }}">
    {% elsif page.layout == "article" %}
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    {% endif %}

    <!-- plugins -->
    <link rel="stylesheet" href="/plugins/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/plugins/themify-icons/themify-icons.css">
    <link rel="stylesheet" href="/plugins/slick/slick.css">

    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="/css/style.css" media="screen">
    {% if page.layout == "article" or page.url == "/" %}
    <link rel="stylesheet" href="{{ '/css/news.css' | relative_url }}" media="screen">
    {% endif %}

    <!--Favicon-->
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>
