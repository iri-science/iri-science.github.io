name: Build and deploy GitHub Pages

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "23 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@v6

      - name: Check out Facility API documentation source
        uses: actions/checkout@v6
        with:
          repository: doe-iri/iri-facility-api-docs
          path: _registry-source

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Test publication tools
        run: |
          ruby test/prepare_registry_test.rb
          ruby test/prepare_openapi_test.rb

      - name: Prepare registry pages
        run: ruby scripts/prepare-registry.rb _registry-source generated-registry

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Publish OpenAPI v2
        run: ruby scripts/prepare-openapi.rb _registry-source _site/api/v2

      - name: Check rendered links
        run: bundle exec htmlproofer _site --disable-external --checks Links,Scripts --allow-missing-href

      - name: Validate registry publication
        run: ruby scripts/validate-registry-build.rb _registry-source _site

      - name: Validate OpenAPI publication
        run: ruby scripts/validate-openapi-build.rb _registry-source _site

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
